<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <!-- Import CSS local -->
    <link rel="stylesheet" href="../styles/style.css">
    <!-- Import Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Import JQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-4 dados-window">
                Dados Pessoais
            </div>
            <div class="col-4 cobranca-window">
                Cobrança
            </div>
            <div class="col-4 entrega-window">
                Entrega
            </div>
        </div>
        <div class="row dados text-center">
            <form action="#" method="post">
                <div class="row">
                    <div class="col-4">
                        <label for="txtNome">Nome</label>
                        <br>
                        <input type="text" name="txtNome" id="txtNome" size="30" required>
                    </div>
                    <div class="col-2"></div>
                    <div class="col-3">
                        <label for="txtCpf">CPF</label>
                        <br>
                        <input type="text" name="txtCpf" id="txtCpf" size="13" required>
                    </div>
                    <div class="col-3"></div>
                </div>
                <div class="row">
                    <div class="col-3">
                        <label for="iIdade">Idade</label>
                        <br>
                        <input type="number" name="iIdade" id="iIdade" size="2">
                    </div>
                    <div class="col-1"></div>
                    <div class="col-2">
                        <label for="selSexo">Sexo</label>
                        <br>
                        <select name="selSexo" id="selSexo">
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                </div>
                <div class="row button-area">
                    <div class="col-2">
                        <button type="submit" class="btn btn-success">Cadastrar</button>
                    </div>
                    <div class="col-1"></div>
                    <div class="col-2">
                        <button type="reset" class="btn btn-danger">Limpar</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="row cobranca">
            <form action="#" method="post">
                <div class="row">
                    <div class="col-4">
                        <label for="txtAgencia">Agência</label>
                        <br>
                        <input type="text" name="txtAgencia" id="txtAgencia" size="30" required>
                    </div>
                    <div class="col-2">
                        <label for="selBanco">Banco</label>
                        <br>
                        <select name="selBanco" id="selBanco">
                            <option value="Itau">Itaú</option>
                            <option value="Santander">Santander</option>
                            <option value="BB">Banco do Brasil</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-3">
                        <label for="txtCc">CC</label>
                        <br>
                        <input type="txtCc" name="txtCc" id="txtCc" size="8">
                    </div>
                </div>
                <div class="row button-area">
                    <div class="col-2">
                        <button type="submit" class="btn btn-success">Cadastrar</button>
                    </div>
                    <div class="col-1"></div>
                    <div class="col-2">
                        <button type="reset" class="btn btn-danger">Limpar</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="row entrega">
            <form action="#" method="post">
                <div class="row">
                    <div class="col-2">
                        <label for="txtCep">CEP</label>
                        <br>
                        <input type="text" name="txtNome" id="txtNome" size="10" required>
                    </div>
                    <div class="col-1"></div>
                    <div class="col-3">
                        <label for="txtEndereco">Endereço</label>
                        <br>
                        <input type="text" name="txtEndereco" id="txtEndereco" size="13" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-3">
                        <label for="iNumero">Número</label>
                        <br>
                        <input type="number" name="iNumero" id="iNumero" size="6">
                    </div>
                    <div class="col-1"></div>
                    <div class="col-2">
                        <label for="txtCidade">Cidade</label>
                        <br>
                        <input type="text" name="txtCidade" id="txtCidade" size="6">
                    </div>
                    <div class="col-1"></div>
                    <div class="col-2">
                        <label for="selEstado">Estado</label>
                        <br>
                        <select name="selEstado" id="selEstado">
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>
                        </select>
                    </div>
                </div>
                <div class="row button-area">
                    <div class="col-2">
                        <button type="submit" class="btn btn-success">Cadastrar</button>
                    </div>
                    <div class="col-1"></div>
                    <div class="col-2">
                        <button type="reset" class="btn btn-danger">Limpar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="../script/script.js"></script>
</body>
</html>
