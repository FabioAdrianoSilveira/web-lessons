<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Import CSS local -->
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- Import do Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Bootstrap 2</title>
  </head>
  <body>
    <div class="container-fluid">
      <header>
        <div class="row">
          <div class="col-2 logo">LOGO</div>
          <div class="col-10 menu">MENU</div>
        </div>
      </header>
      <main>
        <div class="row">
          <div class="col-12 body-style">
            <br />
            <div class="box">
              <form action="" method="post" name="frmAluno">
                <div class="row">
                  <div class="col-1"></div>
                  <div class="col-3">
                    <label for="txtNome" name="lblNome">Nome</label>
                    <br />
                    <input type="text" name="txtNome" size="30" required />
                  </div>
                  <div class="col-4">
                    <label for="txtEndereco" name="lblEndereco">Endereço</label>
                    <br />
                    <input type="text" name="txtEndereco" size="40" />
                  </div>
                  <div class="col-2">
                    <br />
                    <input type="checkbox" name="chkBolsista" checked />
                    <label for="chkBolsista" name="lblBolsista"
                      >Bolsista ?</label
                    >
                  </div>
                </div>
                <div class="row">
                  <div class="col-1"></div>
                  <div class="col-3">
                    <br />
                    <label for="cbxCurso" name="lblCurso">Curso</label>
                    <br />
                    <select name="cbxCurso">
                      <option value="10">ADS</option>
                      <option value="11">BCC</option>
                      <option value="12" selected>ECA</option>
                      <option value="13">Técnico</option>
                    </select>
                  </div>
                  <div class="col-3">
                    <fieldset>
                      <br />
                      <legend>Turno</legend>

                      <input type="radio" name="rdbTurno" checked />
                      <label for="rdbTurno">Matutino</label>
                      <br />
                      <input type="radio" name="rdbTurno" />
                      <label for="rdbTurno">Vespertino</label>
                      <br />
                      <input type="radio" name="rdbTurno" />
                      <label for="rdbTurno">Noturno</label>
                    </fieldset>
                  </div>
                  <div class="col-3">
                    <br />
                    <label for="txtResumo" name="lblResumo">Resumo</label>
                    <br />
                    <textarea cols="50" rows="10"></textarea>
                  </div>
                </div>

                <div class="row">
                  <div class="col-6 text-center">
                    <br />
                    <button
                      type="submit"
                      name="btnCadastrar"
                      class="btn btn-info"
                    >
                      Cadastrar
                    </button>
                  </div>
                  <div class="col-6 text-center">
                    <br />
                    <button type="reset" name="btnLimpar" class="btn btn-info">
                      Limpar
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
      <footer>
        <div class="row">
          <div class="col-12 footer-style">RODAPE</div>
        </div>
      </footer>
    </div>
  </body>
</html>
